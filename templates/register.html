{% extends "base.html" %}

{% block title %}Employee Registration - IT Help Desk{% endblock %}

{% block unauth_content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="text-center mb-4">
            <span class="brand-badge fs-6 mb-2 d-inline-block"><i class="bi bi-person-plus-fill me-1"></i>EMPLOYEE ONBOARDING</span>
            <h3 class="fw-bold text-dark mt-2 mb-1">Create Employee Account</h3>
            <p class="text-muted small">Register to report technical issues and track resolutions</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="mb-3">
                <label for="name" class="form-label fw-semibold">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="name" name="name" value="{{ name or '' }}" placeholder="e.g. John Doe" required autofocus>
                </div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Work Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" placeholder="john.doe@company.com" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" placeholder="At least 6 characters" minlength="6" required>
                </div>
            </div>

            <div class="mb-4">
                <label for="confirm_password" class="form-label fw-semibold">Confirm Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-enter password" minlength="6" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
                <i class="bi bi-check2-circle me-1"></i> Complete Registration
            </button>
        </form>

        <div class="text-center mt-3">
            <span class="text-muted small">Already registered?</span>
            <a href="{{ url_for('auth.login') }}" class="small fw-semibold text-primary text-decoration-none ms-1">Sign in here</a>
        </div>
    </div>
</div>
{% endblock %}
